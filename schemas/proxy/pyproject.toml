[project]
name = "threatcode-schema-proxy"
version = "0.58.3"
description = "ThreatCode Proxy API schemas (GraphQL and OpenAPI)"
readme = "README.md"
license = { text = "CC-BY-4.0" }
requires-python = ">=3.12"
authors = [{ name = "ThreatCode Labs Inc.", email = "dev@khulnasoft.com" }]
repository = "https://github.com/threatcode/schemas/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["threatcode_schema_proxy"]

[tool.hatch.build.targets.wheel.force-include]
"schema.graphql" = "threatcode_schema_proxy/schema.graphql"
"openapi.yaml" = "threatcode_schema_proxy/openapi.yaml"

[tool.hatch.build.targets.sdist]
include = ["schema.graphql", "openapi.yaml"]
